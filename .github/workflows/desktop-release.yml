name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to verify after publish, for example v1.0.2"
        required: true
        default: "v1.0.2"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build unsigned macOS beta
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -e ".[dev]"

      - name: Verify code before release
        run: |
          ruff check src scripts tests
          pytest tests -q -m "not slow"
          npm run test:desktop

      - name: Build helper sidecar
        run: npm run build:helper

      - name: Publish desktop update artifacts
        run: npm run desktop:publish

      - name: Verify update feed assets
        run: npm run desktop:verify-update -- --github --tag="${RELEASE_TAG}"
