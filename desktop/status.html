<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flying Pig</title>
    <link rel="icon" href="assets/app-icon-64.png">
    <link rel="stylesheet" href="status.css">
  </head>
  <body>
    <main class="status-shell">
      <section class="status-panel">
        <img class="app-icon" src="assets/app-icon-128.png" alt="" width="72" height="72">
        <p class="eyebrow">Flying Pig</p>
        <h1 id="title">Starting local helper</h1>
        <p id="message">Preparing the dashboard.</p>
        <div id="spinner" class="spinner" aria-hidden="true"></div>

        <section id="failure" class="failure hidden">
          <div class="actions">
            <button id="retry" type="button">Retry</button>
            <button id="openLogs" class="secondary" type="button">Open Logs</button>
          </div>
          <dl>
            <div>
              <dt>Helper URL</dt>
              <dd id="baseUrl">-</dd>
            </div>
            <div>
              <dt>Log file</dt>
              <dd id="logPath">-</dd>
            </div>
            <div>
              <dt>Last error</dt>
              <dd id="errorText">-</dd>
            </div>
          </dl>
        </section>
      </section>
    </main>
    <script type="module" src="status.js"></script>
  </body>
</html>
